name: mybrew publish to S3
description: Validate an untrusted build artifact, upload its bottles to S3 using GitHub OIDC, check they are publicly downloadable, then commit trusted formulae and registry.

inputs:
  formula:
    description: Target formula the build was requested for
    required: true
  bottle-dir:
    description: Directory with the bottle tarballs and JSON from build-bottle (untrusted)
    required: true
  bucket:
    description: S3 bucket name
    required: true
  key-prefix:
    description: Key prefix the bottles are stored under; must match the root URL's path
    default: bottles/sequoia
  region:
    description: AWS region of the bucket
    required: true
  role-arn:
    description: IAM role to assume via OIDC (job needs id-token:write)
    required: true
  root-url:
    description: Public base URL the formulae point at
    required: true
  tap-dir:
    description: Path to the checked-out tap repository
    default: ${{ github.workspace }}

outputs:
  install:
    description: Space-separated install order of every mybrew formula the target needs
    value: ${{ steps.assemble.outputs.install }}

runs:
  using: composite
  steps:
    - id: assemble
      name: Validate artifact and write formulae
      shell: bash
      env:
        FORMULA: ${{ inputs.formula }}
        ROOT_URL: ${{ inputs.root-url }}
        TAP_DIR: ${{ inputs.tap-dir }}
        BOTTLE_DIR: ${{ inputs.bottle-dir }}
      run: |
        owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
        repo="${GITHUB_REPOSITORY##*/}"
        python3 "${{ github.action_path }}/../../scripts/assemble_publish.py" "$FORMULA" "${owner}/${repo#homebrew-}" \
          "$ROOT_URL" "$TAP_DIR" "$BOTTLE_DIR" "$RUNNER_TEMP/trusted-plan.json" >> "$GITHUB_OUTPUT"

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: mybrew-${{ github.run_id }}

    - name: Upload validated bottles
      shell: bash
      env:
        UPLOADS: ${{ steps.assemble.outputs.uploads }}
        BUCKET: ${{ inputs.bucket }}
        PREFIX: ${{ inputs.key-prefix }}
        ROOT_URL: ${{ inputs.root-url }}
        BOTTLE_DIR: ${{ inputs.bottle-dir }}
      run: |
        for pair in $UPLOADS; do
          filename="${pair%%:*}" key="${pair#*:}"
          aws s3 cp "$BOTTLE_DIR/$filename" "s3://$BUCKET/$PREFIX/$key" --content-type application/gzip --only-show-errors
          curl -fsSIL "$ROOT_URL/$filename" -o /dev/null
          echo "published $ROOT_URL/$filename"
        done

    - name: Commit formulae and registry
      shell: bash
      working-directory: ${{ inputs.tap-dir }}
      env:
        FORMULA: ${{ inputs.formula }}
      run: '"${{ github.action_path }}/../../scripts/commit_formula.sh" "$FORMULA" "$RUNNER_TEMP/trusted-plan.json"'
