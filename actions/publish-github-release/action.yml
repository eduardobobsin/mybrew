name: mybrew publish to GitHub Release
description: Validate an untrusted build artifact, upload its bottles to a release of the calling repository, then commit trusted formulae and registry.

inputs:
  formula:
    description: Target formula the build was requested for
    required: true
  bottle-dir:
    description: Directory with the bottle tarballs and JSON from build-bottle (untrusted)
    required: true
  release-tag:
    description: Release that holds all bottles
    default: bottles
  tap-dir:
    description: Path to the checked-out tap repository
    default: ${{ github.workspace }}
  token:
    description: Token with contents:write on the calling repository
    default: ${{ github.token }}

outputs:
  install:
    description: Space-separated install order of every mybrew formula the target needs
    value: ${{ steps.assemble.outputs.install }}

runs:
  using: composite
  steps:
    - id: assemble
      name: Validate artifact and write formulae
      shell: bash
      env:
        FORMULA: ${{ inputs.formula }}
        TAG: ${{ inputs.release-tag }}
        TAP_DIR: ${{ inputs.tap-dir }}
        BOTTLE_DIR: ${{ inputs.bottle-dir }}
      run: |
        owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
        repo="${GITHUB_REPOSITORY##*/}"
        python3 "${{ github.action_path }}/../../scripts/assemble_publish.py" "$FORMULA" "${owner}/${repo#homebrew-}" \
          "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
          "$TAP_DIR" "$BOTTLE_DIR" "$RUNNER_TEMP/trusted-plan.json" >> "$GITHUB_OUTPUT"

    - name: Upload validated bottles
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.release-tag }}
        UPLOADS: ${{ steps.assemble.outputs.uploads }}
        BOTTLE_DIR: ${{ inputs.bottle-dir }}
      run: |
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Bottles" \
            --notes "Homebrew bottles built by mybrew. Each formula in Formula/ points here."
        for pair in $UPLOADS; do
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$BOTTLE_DIR/${pair%%:*}"
        done

    - name: Commit formulae and registry
      shell: bash
      working-directory: ${{ inputs.tap-dir }}
      env:
        FORMULA: ${{ inputs.formula }}
        GH_TOKEN: ${{ github.token }}
      run: '"${{ github.action_path }}/../../scripts/commit_formula.sh" "$FORMULA" "$RUNNER_TEMP/trusted-plan.json"'
