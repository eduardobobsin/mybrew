name: mybrew build bottles
description: Build bottles for formulae in the calling tap, in order, and merge each bottle block into its formula.

inputs:
  formulae:
    description: Space-separated formula names inside the calling tap, dependencies first
    required: true
  root-url:
    description: Base URL the bottles will be downloaded from
    required: true
  tap-dir:
    description: Path to the checked-out tap repository
    default: ${{ github.workspace }}
  output-dir:
    description: Where to write the bottle tarballs and JSON
    default: ${{ runner.temp }}/bottles

outputs:
  tap:
    description: Tap name, e.g. owner/mybrew
    value: ${{ steps.tap.outputs.tap }}
  output-dir:
    description: Directory holding the bottle tarballs (renamed to their upload filenames) and JSON
    value: ${{ inputs.output-dir }}

runs:
  using: composite
  steps:
    - id: tap
      name: Register checkout as a tap
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        TAP_DIR: ${{ inputs.tap-dir }}
      run: |
        owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
        repo="${GITHUB_REPOSITORY##*/}"
        tap="${owner}/${repo#homebrew-}"
        tap_path="$(brew --repository)/Library/Taps/${owner}/${repo}"
        mkdir -p "$(dirname "$tap_path")"
        ln -sfn "$(cd "$TAP_DIR" && pwd)" "$tap_path"
        brew trust --tap "$tap"
        echo "tap=$tap" >> "$GITHUB_OUTPUT"

    - name: Build, test and bottle
      shell: bash
      env:
        FORMULAE: ${{ inputs.formulae }}
        ROOT_URL: ${{ inputs.root-url }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        # shellcheck disable=SC2086
        "${{ github.action_path }}/../../scripts/build_bottles.sh" "${{ steps.tap.outputs.tap }}" "$ROOT_URL" "$OUTPUT_DIR" $FORMULAE
