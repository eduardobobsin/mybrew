name: mybrew import formula
description: Copy homebrew/core formulae (checksum-verified, bottle block removed) into the calling tap.

inputs:
  formulae:
    description: Space-separated homebrew/core formula names
    required: true
  tap-dir:
    description: Path to the checked-out tap repository
    default: ${{ github.workspace }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FORMULAE: ${{ inputs.formulae }}
        TAP_DIR: ${{ inputs.tap-dir }}
      run: |
        for formula in $FORMULAE; do
          python3 "${{ github.action_path }}/../../scripts/import_formula.py" "$formula" "$TAP_DIR"
        done
