name: mybrew verify install
description: On a fresh runner, install mybrew formulae from the published tap and fail if any had to be compiled.

inputs:
  formulae:
    description: Space-separated install order (the publish action's `install` output)
    required: true
  tap:
    description: Tap to install from; defaults to the calling repository's tap

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAP: ${{ inputs.tap }}
        FORMULAE: ${{ inputs.formulae }}
      run: |
        if [[ -z "$TAP" ]]; then
          owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY##*/}"
          TAP="${owner}/${repo#homebrew-}"
        fi
        # shellcheck disable=SC2086
        "${{ github.action_path }}/../../scripts/verify_install.sh" "$TAP" $FORMULAE
